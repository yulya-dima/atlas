:root{

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
a{color:var(--jade)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:20px}
header{display:grid;gap:10px;padding-block:24px 4px}
.logo-img{align-self:center;width:64px;height:64px}.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font:700 clamp(26px,4vw,40px)/1.05 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:16px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font:500 12px var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.abc{display:flex;flex-wrap:wrap;gap:2px;font:500 13px var(--f-mono)}
.abc button{border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--ink)}
.abc button:disabled{color:var(--line);cursor:default}
.abc button:not(:disabled):hover{background:var(--jade-soft)}
.main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}

.letter{font:700 13px var(--f-display);color:var(--muted);padding:12px 10px 4px;letter-spacing:.06em}

.empty{color:var(--muted);padding:16px 10px}

svg.schema{display:block;width:100%;height:auto;max-width:100%}
.schema .gl{stroke:var(--grid);stroke-width:1}
.schema .gt{fill:var(--muted);font:10px var(--f-mono)}

.schema .pt{fill:var(--saffron);stroke:var(--paper);stroke-width:2;cursor:pointer}

.block{display:grid;gap:8px;align-content:start;min-width:0}
.block h3{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.prices{margin:0;padding:0;list-style:none;display:grid;gap:4px}

.tip{background:var(--jade-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.coord{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;text-decoration:none;color:var(--ink);background:var(--bg);font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--jade);color:var(--jade)}

.warn{color:var(--warn);font-size:13px}
.vid{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px}

footer{color:var(--muted);font-size:13px;max-width:80ch}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const VK = '-226932358';
const S = {q:'', country:'Таиланд', type:'', video:'', sel:null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е');
const MES = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MES1 = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const dt = d => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d||''); return m ? `${+m[3]} ${MES[+m[2]-1]} ${m[1]}` : ''; };
const ym = d => { const m = /^(\d{4})-(\d\d)/.exec(d||''); return m ? `${MES1[+m[2]-1]} ${m[1]}` : ''; };
const tc = s => { s = +s||0; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const km = (a,b) => { const R=6371, r=Math.PI/180, dl=(b.lat-a.lat)*r, dg=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const kmTxt = d => d < 1 ? Math.round(d*1000)+' м' : (d < 10 ? d.toFixed(1).replace('.',',') : Math.round(d))+' км';

D.forEach((p,i) => { p.i = i; p.hay = norm([p.название,p.город,p.страна,p.тип,p.район,p.отзыв].join(' ')); });
const byAnchor = Object.fromEntries(D.map(p => [p.якорь, p]));
const videos = {}; D.forEach(p => p.видео.forEach(v => { (videos[v.id] ||= {...v, места:[]}).места.push(p); }));

function filtered(){
  const q = norm(S.q).trim();
  return D.filter(p => (!S.country || p.страна === S.country) && (!S.type || p.тип === S.type)
    && (!S.video || p.видео.some(v => v.id === S.video)) && (!q || q.split(/\s+/).every(w => p.hay.includes(w))))
    .sort((a,b) => a.название.localeCompare(b.название,'ru'));
}

function chips(){
  const cnt = {}; D.forEach(p => cnt[p.страна] = (cnt[p.страна]||0)+1);
  const cs = [['', 'Все страны', D.length], ...Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,n]) => [k,k,n])];
  $('countries').innerHTML = cs.map(([k,l,n]) => `<button class="chip" data-c="${esc(k)}" aria-pressed="${S.country===k}">${esc(l)} <small>${n}</small></button>`).join('');
  const base = D.filter(p => !S.country || p.страна === S.country), tc_ = {};
  base.forEach(p => tc_[p.тип] = (tc_[p.тип]||0)+1);
  const ts = [['','Все места',base.length], ...Object.entries(tc_).sort((a,b)=>b[1]-a[1]).map(([k,n]) => [k,k[0].toUpperCase()+k.slice(1),n])];
  $('types').innerHTML = ts.map(([k,l,n]) => `<button class="chip" data-t="${esc(k)}" aria-pressed="${S.type===k}">${esc(l)} <small>${n}</small></button>`).join('');
}

function list(){
  const F = filtered(), letters = new Set(F.map(p => p.название[0].toUpperCase()));
  $('abc').innerHTML = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ'.split('').map(l => `<button data-l="${l}" ${letters.has(l)?'':'disabled'}>${l}</button>`).join('');
  if (!F.length){ $('list').innerHTML = `<p class="empty">Ничего не нашлось. Попробуйте другое слово или сбросьте фильтры.</p>`; return F; }
  let last = '', h = '';
  for (const p of F){
    const L = p.название[0].toUpperCase();
    if (L !== last){ h += `<div class="letter" id="L-${L}">${L}</div>`; last = L; }
    h += `<button class="item" data-i="${p.i}" aria-current="${S.sel===p}"><span class="n">${esc(p.название)}</span><span class="m">${esc(p.город||p.страна)}${p.примерно?' · координаты уточняем':''}</span><span class="t">${esc(p.тип)}</span></button>`;
  }
  $('list').innerHTML = h;
  const vf = $('vidfilter');
  if (S.video){ const v = videos[S.video]; vf.hidden = false;
    vf.innerHTML = `<span>Все места из ролика <b>«${esc(v.название)}»</b> — ${v.места.length}</span><button class="chip" id="clearvid">Показать все места ×</button>`; }
  else vf.hidden = true;
  return F;
}


let LM=null, LG=null, LKEY='';
function schema(F){
  const sel=S.sel;
  const pts=(S.video?F:D.filter(p=>(!S.country||p.страна===S.country)&&(!S.type||p.тип===S.type)&&(!S.q||F.includes(p)))).filter(p=>p.lat);
  $('maptitle').innerHTML=`<b>${esc(S.video?'Места ролика':(S.country||'Все страны'))}</b> · ${pts.length} на карте`;
  if(!window.L){ $('lmap').textContent='Карта не загрузилась — места есть в списке слева.'; return; }
  if(!LM){ LM=L.map('lmap',{scrollWheelZoom:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© участники OpenStreetMap'}).addTo(LM); }
  if(LG) LG.remove();
  LG = L.markerClusterGroup ? L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:40}) : L.layerGroup();
  const css=getComputedStyle(document.documentElement);
  pts.forEach(p=>{ const on=p===sel;
    const m=L.circleMarker([p.lat,p.lng],{radius:on?10:7,color:'#fff',weight:2,fillOpacity:1,
      fillColor:on?css.getPropertyValue('--ink'):(p.примерно?'#9AA8A2':css.getPropertyValue('--saffron'))});
    m.bindTooltip(p.название); m.on('click',()=>pick(p)); LG.addLayer(m); });
  LG.addTo(LM);
  const key=[S.country,S.type,S.video,S.q].join('|');
  if(key!==LKEY && pts.length){ LKEY=key; LM.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[30,30],maxZoom:15}); }
  else if(sel&&sel.lat){ LM.setView([sel.lat,sel.lng],Math.max(LM.getZoom(),14)); }
}

function card(){
  const p = S.sel, el = $('card');
  if (!p){ el.innerHTML = `<p class="empty">Выберите место в списке или на схеме.</p>`; return; }
  const mood = {понравилось:['good','Понравилось'], 'не понравилось':['bad','Не понравилось'], нейтрально:['mid','Без восторга']}[p.впечатление];
  const v0 = p.видео[0] || {};
  const prices = (p.цены||[]).map(c => { const m = /^(.*?)\s*[—–-]\s*(.+)$/.exec(c); return m ? `<li><span>${esc(m[1])}</span><span>${esc(m[2])}</span></li>` : `<li><span>${esc(c)}</span><span></span></li>`; }).join('');
  const ll = p.lat ? `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` : '';
  const maps = p.lat ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}">Google Карты</a>
      <a class="btn" target="_blank" rel="noopener" href="https://yandex.ru/maps/?pt=${p.lng},${p.lat}&z=16&l=map">Яндекс Карты</a>
      <a class="btn" target="_blank" rel="noopener" href="https://2gis.ru/geo/${p.lng},${p.lat}">2ГИС</a>`
    : `<a class="btn" target="_blank" rel="noopener" href="${esc(p.карта)}">Открыть на карте</a>`;
  const vids = p.видео.map(v => `<div class="vid"><span class="vt">${esc(v.название)}</span>
      <span class="vm"><span>${esc(dt(v.дата))}</span><span>место на <span class="tc">${tc(v.сек)}</span></span>
      <button class="linkish" data-v="${esc(v.id)}">все места из этого ролика (${videos[v.id].места.length})</button></span>
      <span class="btns"><a class="btn yt" target="_blank" rel="noopener" href="https://youtu.be/${v.id}?t=${v.сек}">▶ YouTube</a>
      ${v.rutube?`<a class="btn rt" target="_blank" rel="noopener" href="https://rutube.ru/video/${v.rutube}/?t=${v.сек}">▶ RUTUBE</a>`:''}
      ${v.vk?`<a class="btn vk" target="_blank" rel="noopener" href="https://vkvideo.ru/video${VK}_${v.vk}?t=${v.сек}">▶ ВК Видео</a>`:''}</span></div>`).join('');
  const near = p.lat ? D.filter(o => o !== p && o.lat && o.страна === p.страна).map(o => [o, km(p,o)]).sort((a,b)=>a[1]-b[1]).slice(0,5) : [];
  el.innerHTML = `
    <div class="kicker"><span class="type">${esc(p.тип)}</span><span>${esc([p.город,p.страна].filter(Boolean).join(', '))}</span>
      ${mood?`<span class="mood ${mood[0]}">${mood[0]==='good'?'♥':mood[0]==='bad'?'✕':'○'} ${mood[1]}</span>`:''}</div>
    <h2>${esc(p.название)}</h2><a class="src" href="m/${p.якорь}.html">Отдельная страница места →</a>
    <div class="block"><p class="review">${esc(p.отзыв||'Отзыв ещё не готов.')}</p>
      <span class="src">${v0.id ? 'Наш отзыв по ролику от ' + esc(dt(v0.дата)) : 'Наша заметка, ролика об этом месте пока нет'}</span></div>
    ${(p.заметки||[]).map(z => `<div class="tip"><b>Заметка Димы:</b> ${esc(z)}</div>`).join('')}
    <div class="cols">
      ${prices?`<div class="block"><h3>Цены на момент съёмки${v0.дата ? ' · ' + esc(ym(v0.дата)) : ''}</h3><ul class="prices">${prices}</ul></div>`:''}
      <div class="block"><h3>Где это</h3>
        ${ll?`<div class="coord"><span>${ll}</span><button class="btn" id="copy">Скопировать</button></div>`:''}
        ${p.примерно?`<span class="warn">${p.lat?'Точка пока примерная — по центру района. Уточним по ссылке из описания ролика.':'Координаты ещё не найдены — уточним.'}</span>`:''}
        <div class="btns">${maps}</div></div>
    </div>
    ${p.совет?`<div class="tip"><b>Совет:</b> ${esc(p.совет)}</div>`:''}
    ${vids ? `<div class="block"><h3>Смотреть в ролике</h3>${vids}</div>` : ''}
    ${near.length?`<div class="block"><h3>Рядом из нашего атласа</h3><ul class="near">${near.map(([o,d]) => `<li><button data-i="${o.i}"><span>${esc(o.название)}</span><span>${kmTxt(d)}</span></button></li>`).join('')}</ul></div>`:''}
    <div class="subscribe">Больше мест — в наших роликах:
      <a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/@Uliya_Dima">YouTube</a>
      <a class="btn" target="_blank" rel="noopener" href="https://rutube.ru/channel/10680831/">RUTUBE</a>
      <a class="btn" target="_blank" rel="noopener" href="https://vkvideo.ru/@uliia_dima">ВК Видео</a>
      <a class="btn" target="_blank" rel="noopener" href="https://t.me/uliia_dima">Telegram</a>
      <a class="btn" target="_blank" rel="noopener" href="https://t.me/uliashka_ai_bot">Спросить Юляшку</a></div>`;
  const cp = $('copy');
  if (cp) cp.onclick = () => { navigator.clipboard?.writeText(ll).then(() => cp.textContent = 'Скопировано', () => cp.textContent = ll).catch(() => cp.textContent = ll); };
}

function render(){
  const F = list();
  if (!S.sel || !F.includes(S.sel)) S.sel = F[0] || null;
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === S.sel?.i)));
  chips(); schema(F); card();
  $('draftinfo').textContent = `${D.length} мест из ${Object.keys(videos).length} роликов, ${new Set(D.map(p=>p.страна)).size} страны.`;
}
function pick(p){ S.sel = p; if (S.country && p.страна !== S.country && !S.video) S.country = p.страна;
  render(); try { history.replaceState(null,'','#'+p.якорь); } catch(e){}
  if (matchMedia('(max-width:860px)').matches) $('card').scrollIntoView({behavior:'smooth', block:'start'}); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-i],[data-c],[data-t],[data-l],[data-v],#clearvid'); if (!t) return;
  if (t.id === 'clearvid'){ S.video = ''; render(); return; }
  if (t.dataset.v){ S.video = t.dataset.v; S.country = ''; S.type = ''; S.q = ''; $('q').value = ''; render(); try{history.replaceState(null,'','#v-'+S.video)}catch(e){}; return; }
  if (t.dataset.c !== undefined){ S.country = t.dataset.c; S.type = ''; S.video = ''; render(); return; }
  if (t.dataset.t !== undefined){ S.type = t.dataset.t; render(); return; }
  if (t.dataset.l){ document.getElementById('L-'+t.dataset.l)?.scrollIntoView({block:'start', behavior:'smooth'}); return; }
  if (t.dataset.i !== undefined) pick(D[+t.dataset.i]);
});
$('q').addEventListener('input', e => { S.q = e.target.value; if (S.q) S.country = ''; render(); });

(function start(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('v-') && videos[h.slice(2)]){ S.video = h.slice(2); S.country = ''; }
  else if (byAnchor[h]){ S.sel = byAnchor[h]; S.country = S.sel.страна; }
  else S.sel = byAnchor['belyy-hram'] || null;
  render();
})();
</script>
</body></html>
